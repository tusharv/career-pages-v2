name: Bump package.json version

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver release type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  issues:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-version:
    if: |
      (
        github.event_name == 'push' &&
        !startsWith(github.event.head_commit.message, 'chore(release):')
      ) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "358703+tusharv@users.noreply.github.com"

      - name: Collect commits since last tag
        id: commits
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "${PREV_TAG}" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "prev_tag=${PREV_TAG}"
            echo "messages<<EOF"
            git log "${RANGE}" --pretty=format:'%s' --no-merges || true
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Determine release type and branch
        id: semver
        uses: actions/github-script@v7
        env:
          COMMIT_MESSAGES: ${{ steps.commits.outputs.messages }}
        with:
          script: |
            const inputType = core.getInput('release_type');
            const eventName = context.eventName;
            let type = inputType || 'patch';
            let branch = (context.payload.repository && context.payload.repository.default_branch) || 'main';

            if (eventName === 'issues') {
              const labels = (context.payload.issue.labels || []).map(l => (typeof l === 'string' ? l : l.name).toLowerCase());
              if (labels.some(l => l.includes('breaking-change') || l === 'major')) type = 'major';
              else if (labels.some(l => l.includes('enhancement') || l.includes('feat'))) type = 'minor';
              else type = 'patch';
            }

            if (eventName === 'push') {
              const lines = (process.env.COMMIT_MESSAGES || '').split('\n').filter(Boolean);
              if (lines.some(m => /BREAKING CHANGE|^\w+(\(.+\))?!:/i.test(m))) type = 'major';
              else if (lines.some(m => /^feat(\(.+\))?:/i.test(m))) type = 'minor';
              else type = 'patch';
            }

            core.setOutput('type', type);
            core.setOutput('branch', branch);

      - name: Bump version and generate changelog
        env:
          TYPE: ${{ steps.semver.outputs.type }}
          COMMIT_MESSAGES: ${{ steps.commits.outputs.messages }}
        run: |
          set -euo pipefail

          COMMITS="$(
            printf '%s\n' "${COMMIT_MESSAGES}" \
              | grep -v -E '^[[:space:]]*$' \
              | grep -v -E '^chore\(release\):' \
              | sed 's/^/- /' \
              || true
          )"
          if [ -z "${COMMITS}" ]; then
            COMMITS="- Routine version bump"
          fi

          npm version "${TYPE}" --no-git-tag-version
          VERSION="$(npm pkg get version | tr -d '"')"
          DATE="$(date -u +%Y-%m-%d)"

          {
            printf '# Changelog\n\n'
            printf '## %s - %s\n\n' "${VERSION}" "${DATE}"
            printf '%s\n\n' "${COMMITS}"
            if [ -f CHANGELOG.md ]; then
              awk '
                BEGIN { skip = 1 }
                skip && $0 == "# Changelog" { next }
                skip && $0 == "" { next }
                { skip = 0; print }
              ' CHANGELOG.md
            fi
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag "v${VERSION}"

      - name: Push commit and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.semver.outputs.branch }}
        run: |
          git push origin "HEAD:${BRANCH}"
          git push origin --tags
